name: Disque non reconnu ou valeurs fausses
description: Un disque n'apparaît pas, n'affiche pas sa santé, ou affiche des valeurs qui semblent fausses.
labels: ["disque"]
body:
  - type: markdown
    attributes:
      value: |
        Merci ! Le fichier JSON permet de prendre en charge votre disque. Dans Aman Disk, sélectionnez le disque, puis :
        - santé non disponible : bouton **Exporter le diagnostic…** sur la page du disque ;
        - valeurs qui semblent fausses : **Exporter en JSON…** dans le menu d'export.
  - type: input
    id: mac
    attributes:
      label: Modèle de Mac
      description: Menu Pomme › À propos de ce Mac (par exemple « MacBook Pro 14 pouces, M3, 2023 »).
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: Version de macOS
      placeholder: "macOS 26.1"
    validations:
      required: true
  - type: textarea
    id: probleme
    attributes:
      label: Ce qui ne va pas
      description: Disque absent, santé non disponible, ou quelle valeur semble fausse (et la valeur attendue, si vous la connaissez).
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: Diagnostic JSON
      description: Collez ici le contenu du fichier créé par « Exporter le diagnostic… » (ou « Exporter en JSON… »), ou glissez le fichier dans ce champ.
      render: json
    validations:
      required: true
